<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة الحارس | ALBASHIR</title>
<link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./guard-manual.css"><script src="./supabase.min.js"></script><script src="./qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#03121e;color:#e5f2ff;font-family:Tahoma,Arial;min-height:100vh}main{max-width:900px;margin:auto;padding:20px}section{background:#0b2638;padding:20px;border:1px solid #27516a;border-radius:18px;margin:16px 0;text-align:center}canvas{display:block;margin:auto;max-width:100%;height:auto!important;background:white}button{padding:14px 24px;background:#087eae;color:white;border:0;border-radius:12px;font:inherit;cursor:pointer}.error{color:#fecaca}.allowed{border-color:#22c55e}.denied{border-color:#ef4444}.limited{border-color:#fb923c}[hidden]{display:none!important}img{width:140px;height:160px;object-fit:cover;border-radius:16px}#countdown{font-size:30px}#result{position:fixed;inset:0;z-index:9999;margin:0;border-radius:0;border-width:4px;background:#03121e;display:grid;place-items:center;align-content:center;padding:clamp(24px,5vw,64px);overflow:auto}#result[hidden]{display:none!important}#result h2{font-size:clamp(42px,8vw,88px);margin:0 0 24px}#result img{width:min(260px,46vw);height:min(300px,52vw);max-width:260px;max-height:300px}#result h3{font-size:clamp(28px,5vw,48px);margin:20px 0 10px}#result p{font-size:clamp(20px,3vw,32px);margin:8px 0}@media(max-height:400px){main{padding:8px}section{padding:10px}canvas{max-height:210px;width:auto!important}#result{padding:16px}#result h2{font-size:36px;margin-bottom:12px}#result img{width:120px;height:130px}#result h3{font-size:24px;margin:8px 0}#result p{font-size:18px}} </style></head>
<body><main><h1>شاشة الحارس — ALBASHIR</h1><p>اعرض الرمز ليمسحه الموظف بهاتفه.</p><p id="runtime" role="status">جارِ الاتصال...</p>
<section id="qrPanel"><canvas id="qr" hidden></canvas><p id="countdown">—</p><button id="refresh">تحديث الرمز</button><p><button id="manualOpen" type="button">الدخول اليدوي للطوارئ</button></p></section>
<section id="guardManualPanel" hidden aria-label="الدخول اليدوي للطوارئ">
  <h2>الدخول اليدوي للطوارئ</h2>
  <form id="guardLoginForm">
    <p><label>الرقم الوطني للحارس (اسم المستخدم)<br><input id="guardIdentity" inputmode="numeric" autocomplete="username" maxlength="20" required></label></p>
    <p><label>كلمة المرور: رقم هاتف الحارس المسجّل<br><input id="guardPhone" type="password" inputmode="tel" autocomplete="current-password" maxlength="25" required></label></p>
    <button id="guardLoginButton">دخول الحارس</button>
  </form>
  <form id="guardEntryForm" hidden>
    <p id="guardWelcome"></p>
    <p><a id="guardProfileLink" href="./guard-profile.html">صفحتي الشخصية — معلومات وصورة اختيارية</a></p>
    <p><label>رقم الموظف الوظيفي أو الوطني<br><input id="manualEmployeeId" maxlength="100" autocomplete="off" required></label></p>
    <button id="guardEntryButton">تسجيل دخول الموظف</button>
    <p>تُسجّل الزيارة وتُحتسب ضمن الحد اليومي المعمول به.</p>
    <button id="guardLogoutButton" type="button">خروج الحارس</button>
  </form>
  <p id="guardManualMessage" role="status"></p>
  <button id="manualClose" type="button">العودة للرمز</button>
</section>
<section id="result" hidden aria-live="assertive"><h2 id="decision"></h2><img id="photo" hidden alt="صورة الموظف"><h3 id="name"></h3><p id="job"></p><p id="specialty"></p></section></main>
<script src="./verify-shared.js"></script><script>
const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const el=id=>document.getElementById(id);let current=null,standby=null,sessions=[],refreshing=false,prewarming=false,polling=false,lastDecision=0,resultUntil=0,photoBlob=null,photoGeneration=0,lastHealthyAt=Date.now(),failureCount=0;
function healthy(message='QR نشط'){lastHealthyAt=Date.now();failureCount=0;el('runtime').className='';el('runtime').textContent=message;}
function unavailable(error){console.error('Public guard runtime failure',error);failureCount++;el('runtime').textContent=failureCount<3?'ضعف اتصال — جاري إعادة المحاولة...':'النظام غير متاح حالياً — جاري إعادة الاتصال';el('runtime').className='error';}
function clearExpired(){if(current&&Date.now()>=current.expiresAt){el('qr').hidden=true;el('qr').getContext('2d').clearRect(0,0,el('qr').width,el('qr').height);el('countdown').textContent='انتهت صلاحية الرمز';}}
async function guardRpc(name,payload={},timeoutMs=5000){const controller=new AbortController();let timer;try{const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>{controller.abort();reject(Error('Guard RPC timeout'));},timeoutMs);});return await Promise.race([client.rpc(name,payload).abortSignal(controller.signal),timeout]);}finally{clearTimeout(timer);}}
async function createCandidate(){const started=Date.now();const {data,error}=await guardRpc('create_public_guard_qr');if(error||data?.ok!==true)throw Error(error?.message||data?.error||'QR unavailable');const expiry=Date.parse(data.expires_at);if(!Number.isFinite(expiry)||expiry<=Date.now())throw Error('Expired QR response');const url=new URL('./verify.html',location.href);url.searchParams.set('token',data.token);url.searchParams.set('public_guard','1');const canvas=document.createElement('canvas');await QRCode.toCanvas(canvas,url.toString(),{width:320,margin:4,errorCorrectionLevel:'M',color:{dark:'#000000',light:'#ffffff'}});if(expiry<=Date.now())throw Error('QR expired during rendering');sessions.push({key:data.read_key,until:started+6*60*1000});return {expiresAt:expiry,canvas};}
function activateCandidate(candidate){if(!candidate)return false;el('qr').width=candidate.canvas.width;el('qr').height=candidate.canvas.height;el('qr').getContext('2d').drawImage(candidate.canvas,0,0);current={expiresAt:candidate.expiresAt};el('qr').hidden=false;healthy('QR نشط');return true;}
async function refresh(){if(refreshing)return;refreshing=true;try{activateCandidate(await createCandidate());standby=null;}catch(e){clearExpired();unavailable(e);}finally{refreshing=false;}}
async function prewarm(){if(prewarming||standby)return;prewarming=true;try{standby=await createCandidate();healthy('QR نشط — الرمز التالي جاهز');}catch(e){unavailable(e);}finally{prewarming=false;}}
function rotate(){if(standby&&standby.expiresAt>Date.now()){const next=standby;standby=null;activateCandidate(next);return true;}return false;}
async function loadPhoto(key){const generation=++photoGeneration;el('photo').hidden=true;if(photoBlob){URL.revokeObjectURL(photoBlob);photoBlob=null;}try{const r=await fetch(APP_CONFIG.SUPABASE_URL+'/functions/v1/employee-photo-url',{method:'POST',headers:{apikey:APP_CONFIG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({actor:{type:'public_guard_session',read_key:key}})});const body=await r.json();if(!r.ok||body.ok!==true)throw Error('Photo unavailable');const image=await fetch(body.url,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(!image.ok)throw Error('Photo download failed');const blob=await image.blob();if(generation!==photoGeneration)return;photoBlob=URL.createObjectURL(blob);el('photo').src=photoBlob;el('photo').hidden=false;}catch(e){if(generation===photoGeneration)unavailable(e);}}
async function poll(){if(polling)return;polling=true;try{sessions=sessions.filter(s=>s.until>Date.now());for(const s of [...sessions].reverse()){const {data,error}=await guardRpc('get_public_guard_result',{p_read_key:s.key});if(error)throw error;if(data?.ok!==true){if(data?.error==='DENIED'){s.until=0;continue;}throw Error('Invalid result response');}if(data.result==='WAITING'){lastHealthyAt=Date.now();continue;}const time=Date.parse(data.decided_at);if(!Number.isFinite(time)||time<=lastDecision)continue;lastDecision=time;resultUntil=Date.now()+10000;const e=data.employee||{};el('decision').textContent=({ALLOWED:'مسموح بالدخول',LIMITED:'مسموح بشكل مؤقت',DENIED:'غير مسموح بالدخول'})[data.result]||'غير مسموح';el('result').className=({ALLOWED:'allowed',LIMITED:'limited',DENIED:'denied'})[data.result]||'denied';el('result').hidden=false;el('qrPanel').hidden=true;el('name').textContent=e.full_name||'';el('job').textContent=e.job_type?'الوظيفة: '+e.job_type:'';el('specialty').textContent=e.specialty?'الاختصاص: '+e.specialty:'';if(e.has_photo)loadPhoto(s.key);else{photoGeneration++;el('photo').hidden=true;if(photoBlob){URL.revokeObjectURL(photoBlob);photoBlob=null;}}}}catch(e){unavailable(e);}finally{polling=false;}}
el('refresh').onclick=()=>{standby=null;refresh();};setInterval(()=>{if(resultUntil&&Date.now()>=resultUntil){resultUntil=0;photoGeneration++;el('result').hidden=true;el('qrPanel').hidden=false;el('name').textContent='';el('job').textContent='';el('specialty').textContent='';el('photo').hidden=true;el('photo').removeAttribute('src');if(photoBlob){URL.revokeObjectURL(photoBlob);photoBlob=null;}}clearExpired();if(current){const remaining=Math.ceil((current.expiresAt-Date.now())/1000);if(remaining>0){el('countdown').textContent=remaining;if(remaining<=3)prewarm();}}if(!current||Date.now()>=current.expiresAt){if(!rotate())refresh();}},1000);setInterval(poll,1500);setInterval(()=>{if(Date.now()-lastHealthyAt>10000){el('runtime').textContent='إعادة تنشيط الاتصال...';el('runtime').className='error';poll();if(!current||current.expiresAt-Date.now()<5000)refresh();}},5000);refresh();window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){poll();if(!current||Date.now()>=current.expiresAt){if(!rotate())refresh();}}});window.addEventListener('pagehide',()=>{photoGeneration++;if(photoBlob)URL.revokeObjectURL(photoBlob);});
</script><script src="./guard-manual.js"></script></body></html>
